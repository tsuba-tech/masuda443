name: Update baseball data

on:
  # 取得元（baseballdata.jp）は深夜バッチで 1 日 1 回だけ生成される。
  # 2026-09-16 時点の Last-Modified は 4 ページとも 03:48-03:49 JST で、
  # 日中は何度取りに行っても内容が変わらない。そのため元更新の直後に 1 回、
  # 元更新が遅れた日の保険としてもう 1 回だけ実行する。
  # GitHub Actions のスケジュールは毎時 0 分・30 分に集中し高負荷時に欠落するため、
  # 混雑を避けた分を指定している。時刻は UTC 指定（+9 時間が JST）。
  schedule:
    - cron: "20 19 * * *"  # 04:20 JST … 元更新の約30分後
    - cron: "20 21 * * *"  # 06:20 JST … 予備
  workflow_dispatch:

concurrency:
  group: masuda443-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MASUDA443_USER_AGENT: MASUDA443-FanSite/1.0 (+https://github.com/${{ github.repository }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Update data
        id: data_update
        continue-on-error: true
        run: python update.py

      - name: Commit changed data and fetch status
        run: |
          if git diff --quiet -- data.json fetch-status.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json fetch-status.json
          git commit -m "chore: update baseball data status"
          git push

      - name: Report update failure
        if: steps.data_update.outcome == 'failure'
        run: exit 1

  deploy:
    needs: update
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
