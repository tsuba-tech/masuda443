name: Update baseball data

on:
  # GitHub Actions のスケジュールは毎時0分・30分に実行が集中し、
  # 高負荷時はイベントが欠落する。混雑を避けて10分・40分にずらしている。
  # 時刻は UTC 指定（+9時間が JST）。
  schedule:
    - cron: "10 8 * * *"   # 17:10 JST
    - cron: "10 12 * * *"  # 21:10 JST
    - cron: "40 12 * * *"  # 21:40 JST
    - cron: "40 13 * * *"  # 22:40 JST
    - cron: "40 14 * * *"  # 23:40 JST
    - cron: "10 16 * * *"  # 翌 1:10 JST
  workflow_dispatch:

concurrency:
  group: masuda443-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MASUDA443_USER_AGENT: MASUDA443-FanSite/1.0 (+https://github.com/${{ github.repository }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Update data
        id: data_update
        continue-on-error: true
        run: python update.py

      - name: Commit changed data and fetch status
        run: |
          if git diff --quiet -- data.json fetch-status.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json fetch-status.json
          git commit -m "chore: update baseball data status"
          git push

      - name: Report update failure
        if: steps.data_update.outcome == 'failure'
        run: exit 1

  deploy:
    needs: update
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
