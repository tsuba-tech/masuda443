name: Update baseball data

on:
  # 取得元（baseballdata.jp）は深夜バッチで 1 日 1 回だけ生成され、日中は変化しない。
  # 2026-09-16 実測の Last-Modified はページごとに差がある:
  #   順位表・首位打者・通算成績 03:48-03:50 / 選手ページ 04:54 / 全打席ページ 06:31
  # 最後発の全打席ページ（直近5・10試合の元データ）より前に取ると、
  # 通算成績だけ当日・直近成績は前日という食い違いが起きる。
  # そのため全打席ページの更新より十分あとに 1 回、遅れた日の保険にもう 1 回だけ実行する。
  # GitHub Actions のスケジュールは毎時 0 分・30 分に集中し高負荷時に欠落するため、
  # 混雑を避けた分を指定している。時刻は UTC 指定（+9 時間が JST）。
  schedule:
    - cron: "20 22 * * *"  # 07:20 JST … 最後発ページの更新から約50分後
    - cron: "20 1 * * *"   # 10:20 JST … 予備
  workflow_dispatch:

concurrency:
  group: masuda443-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MASUDA443_USER_AGENT: MASUDA443-FanSite/1.0 (+https://github.com/${{ github.repository }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Update data
        id: data_update
        continue-on-error: true
        run: python update.py

      - name: Commit changed data and fetch status
        run: |
          if git diff --quiet -- data.json fetch-status.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json fetch-status.json
          git commit -m "chore: update baseball data status"
          git push

      - name: Report update failure
        if: steps.data_update.outcome == 'failure'
        run: exit 1

  deploy:
    needs: update
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
